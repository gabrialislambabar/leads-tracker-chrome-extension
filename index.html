<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadTracker</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="popup-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand-wrap">
                <div class="brand-logo" aria-hidden="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                    </svg>
                </div>
                <div class="brand-meta">
                    <h1 class="brand-title">LeadTracker</h1>
                    <p class="app-subtitle">Saved links</p>
                </div>
            </div>

            <!-- View Usage Button (Opens Usage Dashboard in new tab) -->
            <button type="button" id="view-usage-btn" class="button button-usage" title="Open time tracking dashboard in a new tab">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
                <span>View usage</span>
            </button>
        </header>

        <!-- Save Link Controls -->
        <section class="save-section" aria-label="Save links">
            <div class="save-row">
                <div class="input-with-icon">
                    <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                    </svg>
                    <input type="text" id="url-input" placeholder="Paste URL (e.g. github.com)..." autocomplete="off" spellcheck="false" aria-label="URL to save">
                </div>
                <button type="button" id="save-url-btn" class="button button-primary" disabled aria-label="Save typed URL">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    <span>Save</span>
                </button>
            </div>

            <div class="save-actions">
                <button type="button" id="save-tab-btn" class="button button-secondary" disabled>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect width="20" height="16" x="2" y="4" rx="2"/><path d="M10 4v4"/><path d="M2 8h20"/>
                    </svg>
                    <span>Save current tab</span>
                </button>
            </div>

            <!-- Status Alert Message -->
            <div id="url-status" class="status-message" role="status" aria-live="polite" hidden></div>
        </section>

        <!-- Saved Links Panel -->
        <section class="links-panel" aria-labelledby="saved-heading">
            <div class="section-head">
                <div class="head-title-wrap">
                    <h2 id="saved-heading">Saved links</h2>
                    <span id="link-count" class="count-badge" title="Total saved links">0</span>
                </div>
                <div class="search-wrap">
                    <div class="input-with-icon search-input-wrap">
                        <svg class="input-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        <input type="search" id="link-search" placeholder="Search links..." autocomplete="off" aria-label="Search saved links">
                    </div>
                </div>
            </div>

            <div class="links-list-wrap">
                <ul id="link-list" class="link-list"></ul>
                <div id="link-empty" class="empty-state">
                    <svg class="empty-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                    <p class="empty-title">No saved links yet</p>
                    <p class="empty-subtitle">Paste a URL above or click "Save current tab"</p>
                </div>
            </div>

            <div class="links-footer">
                <button type="button" id="delete-all-btn" class="text-button danger-text" disabled>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                    <span>Delete all links</span>
                </button>
            </div>

            <!-- Confirmation Modal / Box -->
            <div id="delete-confirm" class="confirm-box" hidden>
                <div class="confirm-content">
                    <div class="confirm-icon-wrap" aria-hidden="true">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                    </div>
                    <div class="confirm-text">
                        <h3 class="confirm-title">Delete all saved links?</h3>
                        <p class="confirm-desc">This cannot be undone. Time data is preserved.</p>
                    </div>
                </div>
                <div class="confirm-actions">
                    <button type="button" id="cancel-delete-all" class="button button-ghost">Cancel</button>
                    <button type="button" id="confirm-delete-all" class="button button-danger">Delete all</button>
                </div>
            </div>
        </section>
    </div>

    <script src="index.js"></script>
</body>
</html>
